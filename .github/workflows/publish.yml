name: Publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm config
        run: npm config delete always-auth || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify local version matches npm
        shell: bash
        run: |
          local_version=$(node -p "require('./packages/cli/package.json').version")
          published_version=$(npm view mdxctl version)
          if [ "$local_version" != "$published_version" ]; then
            echo "Local version $local_version does not match npm version $published_version."
            exit 1
          fi

      - name: Bump version
        id: version
        shell: bash
        run: |
          cd packages/cli
          npm version "${{ inputs.release }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Validate release
        run: |
          pnpm typecheck
          pnpm build
          cd packages/cli
          npm pack --dry-run

      - name: Pack npm artifact
        working-directory: packages/cli
        run: |
          mkdir -p ../../release-artifact
          npm pack --pack-destination ../../release-artifact

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdxctl-package
          path: release-artifact/mdxctl-*.tgz
          if-no-files-found: error

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: mdxctl-release-metadata
          path: |
            packages/cli/package.json
            pnpm-lock.yaml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: mdxctl-package
          path: release-artifact

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm config
        run: npm config delete always-auth || true

      - name: Publish to npm with provenance
        shell: bash
        run: |
          package_file=$(find release-artifact -maxdepth 1 -type f -name 'mdxctl-*.tgz' -print -quit)
          test -n "$package_file"
          npm publish "$package_file" --access public

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: mdxctl-release-metadata
          path: release-metadata

      - name: Commit and tag release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp release-metadata/packages/cli/package.json packages/cli/package.json
          cp release-metadata/pnpm-lock.yaml pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json pnpm-lock.yaml
          git commit -m "release mdxctl v${VERSION}"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --title "mdxctl v${VERSION}"
